# Birlikdə Yük — admin paneli nginx konfiqi.
# Bölmə 3: yukadmin.birlikde.biz -> /var/www/yuk/public_admin

server {
    listen 80;
    listen [::]:80;
    server_name yukadmin.birlikde.biz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yukadmin.birlikde.biz;

    root /var/www/yuk/public_admin;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/yukadmin.birlikde.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yukadmin.birlikde.biz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # Giriş formu: brute-force əleyhinə sərt IP limiti (tətbiq səviyyəsindəki
    # 5 cəhd/15 dəqiqə hesab kilidinə əlavə qat — bax README, yuk_login zonası).
    location = /giris {
        limit_req zone=yuk_login burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    limit_req zone=yuk_admin burst=10 nodelay;

    access_log /var/log/nginx/yukadmin.access.log;
    error_log  /var/log/nginx/yukadmin.error.log;
}
