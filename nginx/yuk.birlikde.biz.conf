# Birlikdə Yük — sayt (müştəri + sürücü) nginx konfiqi.
# Bölmə 3: yuk.birlikde.biz -> /var/www/yuk/public
# Getdik layihəsi ilə eyni server, ayrı qovluq, ayrı DB — burada TƏKRAR olunur (paylaşılmır).

server {
    listen 80;
    listen [::]:80;
    server_name yuk.birlikde.biz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yuk.birlikde.biz;

    root /var/www/yuk/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/yuk.birlikde.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuk.birlikde.biz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # CSP: 12.1 — inline stil app.css-ə köçürülüb, script yalnız öz domenindən
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;

    # SSE endpoint-ləri: buffer/keçid söndürülür (uzun-polling üçün). VACİB: bu regex
    # StreamController-in HƏQİQİ route-larına uyğun olmalıdır (/axin/lent, /axin/musteri —
    # bax public/index.php) — köhnə "lent-axini|sse" adları heç vaxt işlədilməyib və bu
    # blok faktiki olaraq heç vaxt uyğunlaşmırdı, SSE cavabları ümumi PHP location-a
    # düşüb nginx tərəfindən buferlənirdi (real-time yeniləmələr yalnız hər ~55s-lik SSE
    # dövrü bağlananda "partladılırdı" — canlı istifadədə "tab dəyişib qayıdanda görünür"
    # kimi hiss olunurdu).
    location ~ ^/axin/ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 65s;
        fastcgi_buffering off;
        proxy_buffering off;
        gzip off;
    }

    # Giriş formu: brute-force əleyhinə sərt IP limiti (tətbiq səviyyəsindəki
    # 5 cəhd/15 dəqiqə hesab kilidinə əlavə qat — bax README, yuk_login zonası).
    location = /giris {
        limit_req zone=yuk_login burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    # Yüklənən/generasiya olunan fayllar: icra qadağandır (12.1 — upload-a PHP keçmir)
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
    }
    location ^~ /storage/ {
        location ~ \.php$ { deny all; }
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri /index.php?$query_string;
    }

    # Sadə sürətli endpoint limiti (12.1) — nginx http bloğunda tərif olunmalı:
    # limit_req_zone $binary_remote_addr zone=yuk_general:10m rate=10r/s;
    limit_req zone=yuk_general burst=20 nodelay;

    access_log /var/log/nginx/yuk.access.log;
    error_log  /var/log/nginx/yuk.error.log;
}
