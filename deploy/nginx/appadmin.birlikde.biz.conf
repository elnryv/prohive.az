server {
    listen 443 ssl http2;
    server_name appadmin.birlikde.biz;

    root /var/www/birlikde/public;
    index admin.php;

    ssl_certificate     /etc/letsencrypt/live/birlikde.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/birlikde.biz/privkey.pem;

    server_tokens off;
    client_max_body_size 8m;

    # Dinamik (PHP) cavablarda başlıqlar App\Core\SecurityHeaders ilə tətbiq
    # olunur — bura yalnız statik fayllar üçün eyni əsas başlıqlar əlavə olunur.
    location ~* \.(css|js|json|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri /admin.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/(config|app|database|storage|routes)/ {
        deny all;
    }
}

server {
    listen 80;
    server_name appadmin.birlikde.biz;
    return 301 https://$host$request_uri;
}
