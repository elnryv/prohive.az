server {
    listen 443 ssl http2;
    server_name app.birlikde.biz;

    root /var/www/birlikde/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/birlikde.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/birlikde.biz/privkey.pem;

    server_tokens off;
    client_max_body_size 8m;

    # sw.js UZUN keşlənə BİLMƏZ — PWA yeniləmələri (public/sw.js-dəki
    # CACHE_VERSION) brauzerdə vaxtında görünməlidir. `=` dəqiq uyğunluq
    # aşağıdakı regex location-dan ÖNCƏ yoxlanılır (nginx qaydası).
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Dinamik (PHP) cavablarda başlıqlar App\Core\SecurityHeaders ilə tətbiq
    # olunur — bura yalnız statik fayllar üçün (PHP-ə çatmayan, birbaşa
    # nginx-in verdiyi CSS/JS/şəkillər) eyni əsas başlıqlar əlavə olunur.
    location ~* \.(css|js|json|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # SSE canlı lövhə (bax CLAUDE.md bölmə 5, SSE-6.2) — buferləmə söndürülür.
    location = /sse/lovhe {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_buffering off;
        proxy_buffering off;
        fastcgi_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/(config|app|database|storage|routes)/ {
        deny all;
    }
}

server {
    listen 80;
    server_name app.birlikde.biz;
    return 301 https://$host$request_uri;
}
