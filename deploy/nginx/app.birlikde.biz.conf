server {
    listen 443 ssl http2;
    server_name app.birlikde.biz;

    root /var/www/birlikde/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/birlikde.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/birlikde.biz/privkey.pem;

    client_max_body_size 8m;

    location / {
        try_files $uri /index.php?$query_string;
    }

    # SSE canlı lövhə (bax CLAUDE.md bölmə 5, SSE-6.2) — buferləmə söndürülür.
    location = /sse/lovhe {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_buffering off;
        proxy_buffering off;
        fastcgi_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/(config|app|database|storage|routes)/ {
        deny all;
    }
}

server {
    listen 80;
    server_name app.birlikde.biz;
    return 301 https://$host$request_uri;
}
