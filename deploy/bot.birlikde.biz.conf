server {
    listen 80;
    server_name bot.birlikde.biz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bot.birlikde.biz;

    # ssl_certificate ... (Certbot ilə)
    # ssl_certificate_key ...

    root /var/www/bot.birlikde.biz/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /webhook.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # app/, config/, .env qorunması
    location ~ /\.env { deny all; }
    location ~ ^/(app|config|database|storage|cron)/ { deny all; }
}
