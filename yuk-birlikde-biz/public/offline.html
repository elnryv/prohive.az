<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yük Birlikdə — Oflayn</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #F8FAFC;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 20px; margin: 0; }
    p { color: #6B7280; font-size: 14px; margin: 0; }
    button {
      margin-top: 16px;
      height: 48px;
      padding: 0 24px;
      border: none;
      border-radius: 18px;
      background: #2563EB;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>İnternet bağlantısı yoxdur</h1>
  <p>Zəhmət olmasa bağlantınızı yoxlayıb yenidən cəhd edin.</p>
  <button onclick="location.reload()">Yenidən cəhd et</button>
</body>
</html>
